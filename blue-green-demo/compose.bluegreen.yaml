
services:
  blue:
    image: research-recommendation:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_DATA_DIR: /app/data
      PORT: "8000"
    restart: unless-stopped
    networks:
      - bluegreen

  green:
    image: research-recommendation:${IMAGE_TAG:-ci}
    build:
      context: ..
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      APP_DATA_DIR: /app/data
      PORT: "8000"
    restart: unless-stopped
    networks:
      - bluegreen

  nginx:
    image: nginx:alpine
    container_name: research-recommendation-router
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./active-upstream.conf:/etc/nginx/conf.d/active-upstream.conf:ro
    depends_on:
      - blue
      - green
    restart: unless-stopped
    networks:
      - bluegreen

networks:
  bluegreen:
    name: research-recommendation-bluegreen
